<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e2e8f0;
        }

        .chat-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1e293b;
        }

        .chat-header {
            background: #0f172a;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #334155;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #10b981;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #status {
            font-size: 13px;
            font-weight: 500;
            color: #f1f5f9;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.server {
            background: #3b82f6;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.client {
            background: #334155;
            color: #f1f5f9;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .input-container {
            padding: 20px 24px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            color: #f1f5f9;
        }

        #messageInput::placeholder {
            color: #94a3b8;
        }

        #messageInput:focus {
            border-color: #3b82f6;
            background: #1e293b;
        }

        #sendBtn {
            padding: 12px 28px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        #sendBtn:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
        }

        #sendBtn:active:not(:disabled) {
            transform: translateY(0);
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            gap: 8px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                WebSocket Chat
            </h1>
            <div class="status-container">
                <div class="status-indicator" id="statusIndicator"></div>
                <div class="status-text">
                    <div class="status-label">Server Status</div>
                    <div id="status">Connecting...</div>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messages">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <p>No messages yet</p>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        const status = document.getElementById('status');
        const statusIndicator = document.getElementById('statusIndicator');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const ws = new WebSocket('wss://websocks-gabghbgccncschfk.centralindia-01.azurewebsites.net');

        ws.onopen = () => {
            status.textContent = 'Connected';
            statusIndicator.classList.add('connected');
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        };

        ws.onmessage = (event) => {
            if (messages.querySelector('.empty-state')) {
                messages.innerHTML = '';
            }

            const message = document.createElement('div');
            message.className = 'message server';
            message.textContent = event.data;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        };

        ws.onerror = () => {
            status.textContent = 'Connection Error';
            statusIndicator.classList.remove('connected');
        };

        ws.onclose = () => {
            status.textContent = 'Disconnected';
            statusIndicator.classList.remove('connected');
            messageInput.disabled = true;
            sendBtn.disabled = true;
        };

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && ws.readyState === WebSocket.OPEN) {
                if (messages.querySelector('.empty-state')) {
                    messages.innerHTML = '';
                }

                const clientMsg = document.createElement('div');
                clientMsg.className = 'message client';
                clientMsg.textContent = message;
                messages.appendChild(clientMsg);

                ws.send(message);
                messageInput.value = '';
                messages.scrollTop = messages.scrollHeight;
            }
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
